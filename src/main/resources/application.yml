server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  config:
    import: optional:file:./.env[.properties]
  datasource:
    # Default is in-memory H2. Point DB_URL at Supabase to switch; the driver is
    # inferred from the URL, so no code or driver-class change is needed.
    url: ${DB_URL:jdbc:h2:mem:plink;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console
  flyway:
    # Flyway owns the schema on every environment. Production drops the dev seed
    # location: FLYWAY_LOCATIONS=classpath:db/migration
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/dev}
  sql:
    init:
      mode: never
  mail:
    # Setting spring.mail.host is what switches sending on at all: a machine without it
    # logs each message instead, which is what development wants.
    #
    # Two shapes are supported without touching code:
    #   local MTA   spring.mail.host=127.0.0.1  SMTP_PORT=25  SMTP_AUTH=false  SMTP_STARTTLS=false
    #   relay       spring.mail.host=smtp.resend.com  RESEND_API_KEY=re_...
    # Authentication and STARTTLS are wrong for a loopback hand-off to Postfix and
    # right for anything across the network, so both are switches rather than constants.
    username: ${SMTP_USERNAME:resend}
    password: ${RESEND_API_KEY:${SMTP_PASSWORD:}}
    port: ${SMTP_PORT:587}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}
            required: ${SMTP_STARTTLS:true}
          # A hung relay must not hold a request thread for minutes.
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

plink:
  auth:
    google-client-id: ${GOOGLE_CLIENT_ID:}
    google-client-secret: ${GOOGLE_CLIENT_SECRET:}
    base-url: ${APP_BASE_URL:http://localhost:3000}
  admin:
    # Creates this administrator at startup, or resets its password if it exists.
    # Also the recovery path when nobody can sign in any more.
    email: ${PLINK_ADMIN_EMAIL:}
    password: ${PLINK_ADMIN_PASSWORD:}
  ticket:
    # Keys personal tokens, gate tokens and OTP hashes. Rotating it invalidates every
    # outstanding ticket URL, so set it once per environment and keep it out of git.
    token-secret: ${TICKET_TOKEN_SECRET:dev-only-insecure-secret}
    # OFF | ADVISE | ENFORCE, applied to holder routes only.
    mobile-only: ${TICKET_MOBILE_ONLY:ADVISE}
    claim-ttl-hours: ${TICKET_CLAIM_TTL_HOURS:72}
    presentation-ttl-seconds: ${TICKET_PRESENTATION_TTL_SECONDS:90}
    code-period-seconds: ${TICKET_CODE_PERIOD_SECONDS:10}
    rebind-max-per-ticket: ${TICKET_REBIND_MAX:2}
    # The From address. With Resend this must be on a domain verified there.
    mail-from: ${MAIL_FROM:no-reply@plink.local}
